name: website

# Publishes website/ to GitHub Pages, served at https://notching.web.id.
# Runs when the site changes on main, when a release is published (the build
# fills in the new version, DMG link and size), and by hand from the Actions tab.
#
# One-time setup: Settings → Pages → Source "GitHub Actions", custom domain
# notching.web.id, then Enforce HTTPS once the certificate is ready.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: build the site with the latest release
        run: node website/build.mjs _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
