name: release

# Push a tag vX.Y.Z to release Notching X.Y.Z. One matrix job per platform builds
# and attaches its installers to the same DRAFT GitHub Release:
#   macOS (Apple Silicon): signed with Developer ID, notarized, stapled DMG
#   Windows: NSIS setup.exe + MSI (unsigned)
#   Linux (built on Ubuntu 22.04): deb + rpm + AppImage (unsigned)
# Check the notarization line in the macOS log, then publish:
#   gh release edit vX.Y.Z --draft=false
#
# The tag must equal the version in src-tauri/tauri.conf.json, package.json and
# src-tauri/Cargo.toml; the draft job fails otherwise, before anything is built.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Creates the draft once, so the three build jobs do not race to create it.
  draft:
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.release.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: tag matches app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$tag tauri.conf=$conf package=$pkg cargo=$cargo"
          [ "$tag" = "$conf" ] && [ "$tag" = "$pkg" ] && [ "$tag" = "$cargo" ] || {
            echo "::error::tag v$tag does not match the app version"; exit 1; }

      - name: create draft release
        id: release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Notching $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          echo "id=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: Linux (deb, rpm, AppImage)
            os: ubuntu-22.04
            target: ''
            args: ''
          - name: Windows (nsis, msi)
            os: windows-latest
            target: ''
            args: ''
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2

      - name: install frontend dependencies
        run: npm ci

      - name: frontend tests
        run: npm test

      # tauri::generate_context! needs the built frontend (../dist) to compile.
      - name: rust tests
        run: |
          npm run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      # Imported here, before the build, because build.rs signs the Now Playing
      # dylib (a bundle resource) during `cargo build`, earlier than the bundler
      # would import APPLE_CERTIFICATE itself. So APPLE_CERTIFICATE is not passed
      # to tauri-action below: a second copy of the identity would be ambiguous.
      - name: import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/notching-signing.keychain-db"
          pass=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain"
          # shellcheck disable=SC2046  # the existing keychain list must word-split
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      # The Apple signing variables are empty on Windows and Linux: the bundler
      # only signs and notarizes when they are set.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          # Notarization (Apple ID + app-specific password).
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }}

      # The release is still a draft: if this fails, do not publish it.
      # Checks the app inside the uploaded DMG, which is what users launch.
      - name: verify signature and notarization
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls "src-tauri/target/$TARGET/release/bundle/dmg/"*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          app="$mnt/Notching.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/Resources/media/libnotching-media.dylib"
          codesign -d --entitlements - "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: remove signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/notching-signing.keychain-db" || true
