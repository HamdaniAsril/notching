<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradasi panel</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f2f2; --surface: #fff; --fg: #111; --muted: #6b6b6b; --line: rgba(0,0,0,.1); --on: #111; --on-fg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0b; --surface: #161616; --fg: #f2f2f2; --muted: #9a9a9a; --line: rgba(255,255,255,.12); --on: #f2f2f2; --on-fg: #111;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0b; --surface: #161616; --fg: #f2f2f2; --muted: #9a9a9a; --line: rgba(255,255,255,.12); --on: #f2f2f2; --on-fg: #111;
  }

  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: "Space Grotesk", -apple-system, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.5; }
  .page { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 6px; letter-spacing: -.2px; }
  h2 { font-size: 16px; font-weight: 500; margin: 0 0 4px; }
  .lead { margin: 0 0 22px; color: var(--muted); max-width: 640px; }
  .mlab { font-family: "Space Mono", ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .12em;
          text-transform: uppercase; color: var(--muted); }

  .ctl { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; margin-bottom: 22px; }
  .ctl > div { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
  .seg button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--fg); padding: 6px 14px;
                border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--on); color: var(--on-fg); }
  .seg button:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 18px; }
  .var { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 16px; min-width: 0; }
  .var .vh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .var .vh b { font-weight: 500; font-size: 15px; }

  .tune { margin-top: 28px; }
  .sliders { display: flex; flex-wrap: wrap; gap: 14px 32px; margin: 12px 0 14px; }
  .sliders label { display: flex; align-items: center; gap: 12px; }
  .sliders input { width: 200px; accent-color: var(--fg); }
  .sliders output { font-family: "Space Mono", ui-monospace, monospace; font-size: 12px; min-width: 40px; }

  /* A cropped view of the 640×290 overlay, scaled to fit its card. */
  .frame { position: relative; overflow: hidden; border-radius: 10px; }
  .scene { position: absolute; top: 0; left: 0; width: 640px; height: 290px; transform-origin: top left; overflow: hidden; }

  [data-wall="dark"] .scene, [data-wall="window"] .scene {
    background: radial-gradient(120% 100% at 30% 0%, #2c3150 0%, #15172c 55%, #0a0a12 100%); }
  [data-wall="light"] .scene {
    background: radial-gradient(120% 90% at 20% 10%, #ffffff 0%, #eef2f8 45%, #d9e2ef 100%); }
  [data-wall="color"] .scene {
    background:
      radial-gradient(55% 80% at 12% 35%, #ff8a3d 0%, transparent 62%),
      radial-gradient(55% 90% at 85% 15%, #4b6bff 0%, transparent 65%),
      radial-gradient(70% 80% at 55% 105%, #ff4fa3 0%, transparent 62%),
      #2a1e5c; }

  .menubar { position: absolute; inset: 0 0 auto; height: 32px; background: rgba(255,255,255,.16); }
  [data-wall="light"] .menubar { background: rgba(255,255,255,.55); }

  /* "Jendela": a document window behind the panel. */
  .win { display: none; position: absolute; left: 18px; right: 18px; top: 40px; bottom: -20px; background: #fbfbfb;
         border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35); color: #1d1d1f; font-size: 13px; line-height: 1.55;
         font-family: -apple-system, "Segoe UI", sans-serif; }
  [data-wall="window"] .win { display: block; }
  .win .tb { height: 28px; border-bottom: 1px solid #e4e4e4; display: flex; align-items: center; gap: 7px; padding: 0 12px; }
  .win .tb i { width: 11px; height: 11px; border-radius: 50%; background: #ddd; }
  .win .tb span { margin: 0 auto; font-size: 12px; color: #777; padding-right: 50px; }
  .win .doc { padding: 12px 34px; }
  .win .doc p { margin: 0 0 8px; }
  .win .doc strong { font-weight: 600; }

  .shape { position: absolute; top: 0; left: 0; pointer-events: none; }

  /* Beranda N2, from beranda-nothing.html; scoped so it never restyles the page. */
  .crd { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 540px; box-sizing: border-box;
         padding: 42px 18px 16px; color: #fff;
         --g1: rgba(255,255,255,.68); --g2: rgba(255,255,255,.42); --g3: rgba(255,255,255,.16); --red: #E8262E;
         font-size: 13px; line-height: normal; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  .crd .home { height: 156px; display: flex; flex-direction: column; }
  .crd .lab, .crd .rm .m, .crd .foot { font-family: "Space Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  .crd .lab { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--g2); white-space: nowrap;
              display: flex; align-items: center; gap: 6px; line-height: 14px; }
  .crd .rd { width: 6px; height: 6px; border-radius: 50%; background: var(--red); display: inline-block; flex: none; }
  .crd .dm { display: block; }
  .crd .cols { display: flex; gap: 18px; }
  .crd .vdots { width: 3px; flex: none; align-self: stretch;
                background: radial-gradient(circle, rgba(255,255,255,.3) .9px, transparent 1.3px) center top / 3px 5px repeat-y; }
  .crd .hdots { height: 3px; margin: auto 0 10px;
                background: radial-gradient(circle, rgba(255,255,255,.3) .9px, transparent 1.3px) left center / 5px 3px repeat-x; }
  .crd .next { font-size: 15px; font-weight: 500; white-space: nowrap; letter-spacing: -.1px; line-height: 19px; }
  .crd .prog { display: flex; align-items: center; gap: 8px; }
  .crd .rm { display: flex; align-items: center; gap: 9px; white-space: nowrap; line-height: 18px; }
  .crd .rm .ck { width: 8px; height: 8px; border-radius: 50%; border: 1.2px solid var(--g2); flex: none; }
  .crd .rm .m { margin-left: auto; padding-left: 14px; color: var(--g2); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .crd .foot { display: flex; gap: 16px; align-items: center; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
               color: var(--g2); white-space: nowrap; }
  .crd .foot b { color: var(--g1); font-weight: 400; }
  .crd .foot .song { display: flex; align-items: center; gap: 6px; font-family: "Space Grotesk", -apple-system, sans-serif;
                     font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--g2); }
  .crd .foot .song span { color: var(--g1); }
  .crd .foot svg { width: 12px; height: 12px; }
  .crd .foot .clk { margin-left: auto; color: var(--g1); font-size: 11px; }

  /* Navigation pill, from notch.css; --pill-a is 1 unless it fades with the panel. */
  .pl { position: absolute; top: 224px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;
        padding: 8px 16px 11px; border-radius: 18px; background: rgba(0,0,0,var(--pill-a, 1)); color: #fff; }
  .pl .ic { position: relative; }
  .pl svg { width: 15px; height: 15px; opacity: .4; display: block; }
  .pl .on svg { opacity: 1; }
  .pl .on::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 3px; height: 3px; margin-left: -1.5px;
                   border-radius: 50%; background: #fff; }
</style>
</head>
<body data-wall="dark" data-pill="solid">
<div class="page">
  <h1>Gradasi panel</h1>
  <p class="lead">Bagian atas tetap hitam pekat supaya menyatu dengan notch, lalu memudar ke bawah. Ganti latarnya untuk melihat kapan teks bagian bawah mulai susah dibaca.</p>

  <div class="ctl">
    <div><span class="mlab">Latar</span>
      <span class="seg" data-set="wall">
        <button data-v="dark" aria-pressed="true">Gelap</button>
        <button data-v="light">Terang</button>
        <button data-v="color">Berwarna</button>
        <button data-v="window">Jendela</button>
      </span>
    </div>
    <div><span class="mlab">Pil</span>
      <span class="seg" data-set="pill">
        <button data-v="solid" aria-pressed="true">Pekat</button>
        <button data-v="fade">Ikut memudar</button>
      </span>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <section class="tune">
    <h2>Atur sendiri</h2>
    <div class="sliders">
      <label><span class="mlab">Mulai pudar</span><input id="start" type="range" min="0" max="90" step="5" value="45"><output id="startOut"></output></label>
      <label><span class="mlab">Opacity bawah</span><input id="bottom" type="range" min="10" max="100" step="5" value="60"><output id="bottomOut"></output></label>
    </div>
    <div class="var" id="custom"></div>
  </section>
</div>

<script>
(function () {
  const W = 640, H = 290, PW = 540, PH = 214; // overlay, Beranda card 540 wide, notch 32 + 10 + 156 + 16

  // panelPath() from src/notch/shape.ts.
  const q = v => v.toFixed(2);
  function panelPath(pw, ph) {
    const w = Math.max(0, pw) / 2, h = Math.max(0, ph);
    const R = Math.min(28, w, h * 0.5), fl = Math.min(12, w * 0.3);
    return `M ${q(-w - fl)} 0 Q ${q(-w)} 0 ${q(-w)} ${q(fl)} L ${q(-w)} ${q(h - R)} Q ${q(-w)} ${q(h)} ${q(-w + R)} ${q(h)} ` +
      `L ${q(w - R)} ${q(h)} Q ${q(w)} ${q(h)} ${q(w)} ${q(h - R)} L ${q(w)} ${q(fl)} Q ${q(w)} 0 ${q(w + fl)} 0 Z`;
  }

  // Solid down to `start`, then an eased fade to `bottom`, so no hard line shows where it begins.
  const smooth = t => t * t * (3 - 2 * t);
  function stops(start, bottom) {
    let s = '<stop offset="0" stop-color="#000"/>';
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      s += `<stop offset="${(start + (1 - start) * t).toFixed(3)}" stop-color="#000" stop-opacity="${(1 - (1 - bottom) * smooth(t)).toFixed(3)}"/>`;
    }
    return s;
  }

  // 5×7 dot digits, from beranda-nothing.html.
  const G = {
    '1':['00100','01100','00100','00100','00100','00100','01110'],
    '2':['01110','10001','00001','00010','00100','01000','11111'],
    '3':['11111','00010','00100','00010','00001','10001','01110'],
    '7':['11111','00001','00010','00100','01000','01000','01000'],
    '9':['01110','10001','10001','01111','00001','00010','01100'],
    '°':['010','101','010','000','000','000','000'],
  };
  const dots = (str, p) => {
    let x = 0, out = '';
    for (const ch of str) {
      const g = G[ch];
      g.forEach((row, r) => [...row].forEach((b, c) => {
        if (b === '1') out += `<circle cx="${(x + c) * p + p / 2}" cy="${r * p + p / 2}" r="${p * .4}"/>`;
      }));
      x += g[0].length + 1;
    }
    const w = (x - 1) * p, h = 7 * p;
    return `<svg class="dm" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="currentColor">${out}</svg>`;
  };
  const bar = (n, lit) => {
    let out = '';
    for (let i = 0; i < n; i++) out += `<circle cx="${i * 6 + 2.5}" cy="2.5" r="1.7" fill="${i < lit ? '#fff' : 'rgba(255,255,255,.16)'}"/>`;
    return `<svg width="${n * 6 - 1}" height="5">${out}</svg>`;
  };
  const L = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const I = {
    home:  '<path d="M4 11l8-6.5 8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/>',
    music: '<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
    stat:  '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 15v-3M12 15V9M16 15v-5"/>',
    more:  '<circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/>',
  };

  const card = `<div class="home">
      <div class="cols">
        <div>
          <div class="lab"><i class="rd"></i>Kamis</div>
          <div style="margin-top:10px">${dots('29', 8)}</div>
          <div class="lab" style="margin-top:10px">Oktober 2026</div>
        </div>
        <div class="vdots"></div>
        <div>
          <div class="lab">Jakarta</div>
          <div style="margin-top:10px; color:var(--g2)">${dots('31°', 8)}</div>
          <div class="lab" style="margin-top:10px">Berawan · 25°/33°</div>
        </div>
        <div class="vdots"></div>
        <div style="flex:1; min-width:0">
          <div class="lab">Berikutnya</div>
          <div class="next" style="margin-top:6px">Dzuhur 11.47</div>
          <div class="prog" style="margin-top:7px">${bar(18, 15)}<span class="lab">1 j 22 m</span></div>
          <div style="margin-top:12px">
            <div class="rm"><span class="ck"></span>Kirim invoice<span class="m">14.00</span></div>
            <div class="rm" style="margin-top:4px"><span class="ck"></span>Bayar listrik<span class="m">Hari ini</span></div>
          </div>
        </div>
      </div>
      <div class="hdots"></div>
      <div class="foot">
        <span class="song">${L(I.music)}<span>Nama lagu</span>Nama artis</span>
        <span>Timer <b>12.30</b></span><span>Agent <b>4/7</b></span>
        <span class="clk">10.25</span>
      </div>
    </div>`;
  const pill = `<div class="pl">${['home', 'stat', 'music', 'more']
    .map((k, i) => `<span class="ic ${i === 0 ? 'on' : ''}">${L(I[k])}</span>`).join('')}</div>`;
  const win = `<div class="win"><div class="tb"><i></i><i></i><i></i><span>Catatan rapat.txt</span></div><div class="doc">
      <p><strong>Rapat mingguan, 29 Oktober.</strong> Hadir: tim desain, tim produk, dan dua orang dari tim data.</p>
      <p>Rilis versi berikutnya digeser satu minggu karena pengujian di layar eksternal belum selesai. Panel harus tetap terbaca di atas jendela terang seperti ini, dan di atas wallpaper yang ramai.</p>
      <p>Tindak lanjut: periksa kontras teks kecil di bagian bawah panel, catat hasilnya sebelum Jumat, lalu kirim ringkasan ke semua peserta.</p>
      <p>Catatan tambahan: reminder sholat sebaiknya tetap muncul walau mode fokus menyala.</p>
    </div></div>`;

  let n = 0;
  // One scaled overlay scene; returns a setter for the gradient.
  function scene(host) {
    const id = 'g' + (n++);
    host.insertAdjacentHTML('beforeend', `<div class="frame"><div class="scene">
        ${win}<div class="menubar"></div>
        <svg class="shape" width="${W}" height="${H}" viewBox="${-W / 2} 0 ${W} ${H}">
          <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"></linearGradient></defs>
          <path d="${panelPath(PW, PH)}" fill="url(#${id})"/>
        </svg>
        <div class="crd">${card}</div>${pill}
      </div></div>`);
    const frame = host.lastElementChild, sc = frame.firstElementChild, grad = sc.querySelector('linearGradient');
    const fit = () => {
      const k = Math.min(1, frame.clientWidth / W);
      sc.style.transform = `scale(${k})`;
      sc.style.left = Math.max(0, (frame.clientWidth - W) / 2) + 'px';
      frame.style.height = H * k + 'px';
    };
    new ResizeObserver(fit).observe(frame);
    fit();
    return (start, bottom) => {
      grad.innerHTML = stops(start, bottom);
      sc.dataset.bottom = bottom;
      sc.style.setProperty('--pill-a', document.body.dataset.pill === 'fade' ? bottom : 1);
    };
  }

  const presets = [
    { t: 'Sekarang', d: 'Hitam pekat', start: 1, bottom: 1 },
    { t: 'A. Halus', d: 'Mulai pudar 55% · bawah 80%', start: .55, bottom: .8 },
    { t: 'B. Sedang', d: 'Mulai pudar 40% · bawah 55%', start: .4, bottom: .55 },
    { t: 'C. Kuat', d: 'Mulai pudar 25% · bawah 30%', start: .25, bottom: .3 },
  ];
  const grid = document.getElementById('grid');
  const setters = presets.map(p => {
    grid.insertAdjacentHTML('beforeend', `<div class="var"><div class="vh"><b>${p.t}</b><span class="mlab">${p.d}</span></div></div>`);
    const set = scene(grid.lastElementChild);
    return () => set(p.start, p.bottom);
  });

  const startIn = document.getElementById('start'), bottomIn = document.getElementById('bottom');
  const startOut = document.getElementById('startOut'), bottomOut = document.getElementById('bottomOut');
  const setCustom = scene(document.getElementById('custom'));
  const custom = () => {
    startOut.textContent = startIn.value + '%';
    bottomOut.textContent = bottomIn.value + '%';
    setCustom(startIn.value / 100, bottomIn.value / 100);
  };
  setters.push(custom);
  startIn.addEventListener('input', custom);
  bottomIn.addEventListener('input', custom);

  const redraw = () => setters.forEach(f => f());
  document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    document.body.dataset[seg.dataset.set] = b.dataset.v;
    redraw();
  }));
  redraw();
})();
</script>
</body>
</html>
