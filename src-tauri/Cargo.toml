[package]
name = "notching"
version = "0.1.3"
description = "Notching: a calm notch for daily tools"
authors = ["HamdaniAsril"]
license = "MIT"
repository = "https://github.com/HamdaniAsril/notching"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notching_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
sysinfo = { version = "0.39", default-features = false, features = ["system", "network", "component"] }
chrono = "0.4"
plist = "1"
# HTTPS through macOS's own TLS (Security framework), no rustls.
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[dev-dependencies]
tempfile = "3"

# Same objc2 family versions that Tauri itself pulls in (check: cargo tree -d | grep objc2).
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"
objc2 = "0.6"
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
block2 = "0.6"
libc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSGeometry",
  "NSNotification",
  "NSOperation",
  "NSString",
  "NSObject",
  "NSArray",
  "NSDictionary",
  "NSValue",
  "NSDistributedNotificationCenter",
  "NSURL",
  "NSData",
  "NSError",
  "NSFileManager",
  "NSProcessInfo",
  "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "NSGraphicsContext",
  "NSScreen",
  "NSEvent",
  "NSWindow",
  "NSPanel",
  "NSResponder",
  "NSApplication",
  "NSGraphics",
  "NSView",
  "NSTrackingArea",
  "NSColor",
  "NSSound",
  "NSWorkspace",
  "NSRunningApplication",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSDragging",
  "NSDraggingItem",
  "NSDraggingSession",
  "NSFilePromiseReceiver",
  "NSAppearance",
  "NSGlassEffectView",
] }
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "bitflags",
  "objc2-app-kit",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "QLThumbnailGenerator",
  "QLThumbnailGenerationRequest",
  "QLThumbnailRepresentation",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEventSource", "CGEventTypes", "CGWindow", "CGImage"] }
# Intip jendela's window pictures on macOS 14+ (design 5 Nov §8).
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-graphics",
  "objc2-core-foundation",
  "SCShareableContent",
  "SCScreenshotManager",
  "SCStream",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
