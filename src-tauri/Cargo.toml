[package]
name = "notching"
version = "0.1.0"
description = "Notching: a calm notch for daily tools"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notching_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
sysinfo = { version = "0.39", default-features = false, features = ["system", "network"] }
chrono = "0.4"
# HTTPS through macOS's own TLS (Security framework), no rustls.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[dev-dependencies]
tempfile = "3"

# Same objc2 family versions that Tauri itself pulls in (check: cargo tree -d | grep objc2).
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"
objc2 = "0.6"
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSGeometry",
  "NSNotification",
  "NSOperation",
  "NSString",
  "NSObject",
  "NSArray",
  "NSDictionary",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSScreen",
  "NSEvent",
  "NSWindow",
  "NSPanel",
  "NSResponder",
  "NSApplication",
  "NSGraphics",
  "NSView",
  "NSTrackingArea",
  "NSColor",
  "NSSound",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEventSource", "CGEventTypes", "CGWindow"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
